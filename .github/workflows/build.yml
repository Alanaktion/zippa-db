---
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install GTK3 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: ./build.sh

      - name: Check binary
        run: |
          ls -lh build/zippa-db
          # Binary requires display for full execution, just verify it can show help
          ./build/zippa-db --help 2>&1 | grep -q "help" || true
