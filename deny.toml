# Checked by `cargo deny check` in CI.

[graph]
# The platforms we ship; keeps a Windows-only crate's licence out of the way
# of a Linux check and the reverse.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
# Each is reviewed; revisit when the dependency that carries it moves.
ignore = [
    # `rsa` via russh, only used to sign an SSH login with the user's own RSA
    # key on their machine; no upstream fix exists.
    { id = "RUSTSEC-2023-0071", reason = "rsa timing side channel; local signing only, no fixed release" },
    # Unmaintained crates carried in by GPUI and its platform layers.
    { id = "RUSTSEC-2024-0384", reason = "instant: transitive via GPUI" },
    { id = "RUSTSEC-2024-0436", reason = "paste: transitive via GPUI" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: transitive via GPUI" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: transitive via GPUI" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: transitive via the keyring/GPUI Linux stack" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: transitive via the keyring/GPUI Linux stack" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: transitive via the keyring/GPUI Linux stack" },
]

[licenses]
version = 2
# Permissive licences only. MPL-2.0 is file-level copyleft and fine unmodified.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
