<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Light Mode) -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F4F5F8"/>
      <stop offset="100%" stop-color="#EAECEF"/>
    </linearGradient>

    <!-- Disc Surface & Cylinder Gradients (Light Mode) -->
    <linearGradient id="disc-fill-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAECEF"/>
    </linearGradient>

    <!-- Z / Lightning Energy Gradient (Slightly Deeper for Light Mode Contrast) -->
    <linearGradient id="bolt-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="bolt-glow-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="drop-shadow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E202B" flood-opacity="0.12"/>
    </filter>

    <filter id="bolt-glow-filter-light" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg-grad-light)"/>

  <!-- Subtle Background Grid Overlay -->
  <g opacity="0.06" stroke="#1E202B" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="224" x2="512" y2="224"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="416" x2="512" y2="416"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="224" y1="0" x2="224" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="416" y1="0" x2="416" y2="512"/>
  </g>

  <!-- Stacked Database Discs (Database Engine Nodes) -->
  <g transform="translate(136, 120)">

    <!-- Bottom Disc (SQLite - Soft Cyan Highlight) -->
    <g transform="translate(0, 180)">
      <path d="M 0,28 L 0,60 C 0,75.47 53.73,88 120,88 C 186.27,88 240,75.47 240,60 L 240,28" fill="url(#disc-fill-light)" stroke="#D5D8E1" stroke-width="3"/>
      <ellipse cx="120" cy="28" rx="120" ry="28" fill="url(#disc-fill-light)" stroke="#6C7393" stroke-width="2"/>
      <ellipse cx="120" cy="28" rx="118" ry="26" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Middle Disc (Postgres - Cobalt Blue Highlight) -->
    <g transform="translate(0, 90)">
      <path d="M 0,28 L 0,60 C 0,75.47 53.73,88 120,88 C 186.27,88 240,75.47 240,60 L 240,28" fill="url(#disc-fill-light)" stroke="#D5D8E1" stroke-width="3"/>
      <ellipse cx="120" cy="28" rx="120" ry="28" fill="url(#disc-fill-light)" stroke="#6C7393" stroke-width="2"/>
      <ellipse cx="120" cy="28" rx="118" ry="26" fill="none" stroke="#2563EB" stroke-width="2" opacity="0.7"/>
    </g>

    <!-- Top Disc (MySQL - Amber Highlight) -->
    <g transform="translate(0, 0)">
      <path d="M 0,28 L 0,60 C 0,75.47 53.73,88 120,88 C 186.27,88 240,75.47 240,60 L 240,28" fill="url(#disc-fill-light)" stroke="#D5D8E1" stroke-width="3"/>
      <ellipse cx="120" cy="28" rx="120" ry="28" fill="url(#disc-fill-light)" stroke="#6C7393" stroke-width="2"/>
      <ellipse cx="120" cy="28" rx="118" ry="26" fill="none" stroke="#D97706" stroke-width="2.5" opacity="0.85"/>
    </g>

  </g>

  <!-- "Zippa" Diagonal Cut Lightning / Z Motif -->
  <!-- Back Glow Path -->
  <path d="M 330 90
            L 210 240
            H 290
            L 170 420
            L 210 270
            H 140
            Z"
        fill="url(#bolt-glow-light)"
        filter="url(#bolt-glow-filter-light)"
        opacity="0.9"/>

  <!-- Sharp Foreground Z-Bolt -->
  <path d="M 340 80
            L 210 245
            H 295
            L 165 430
            L 210 265
            H 130
            Z"
        fill="url(#bolt-grad-light)"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linejoin="round"
        filter="url(#drop-shadow-light)"/>

  <!-- Dynamic Accent Flares -->
  <circle cx="340" cy="80" r="4" fill="#7C4DFF" filter="url(#bolt-glow-filter-light)"/>
  <circle cx="165" cy="430" r="4" fill="#0284C7" filter="url(#bolt-glow-filter-light)"/>

</svg>
