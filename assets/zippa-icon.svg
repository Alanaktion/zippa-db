<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C25"/>
      <stop offset="50%" stop-color="#13141C"/>
      <stop offset="100%" stop-color="#0D0E14"/>
    </linearGradient>

    <!-- Disc Surface & Cylinder Gradients -->
    <linearGradient id="disc-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2E3D"/>
      <stop offset="100%" stop-color="#1E212B"/>
    </linearGradient>

    <linearGradient id="disc-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#565F89"/>
      <stop offset="50%" stop-color="#9ECE6A"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>

    <!-- Z / Lightning Energy Gradient -->
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BB9AF7"/>
      <stop offset="50%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>

    <linearGradient id="bolt-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BB9AF7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7DCFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="bolt-glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip Path for App Icon Squircle Base -->
    <clipPath id="squircle-clip">
      <rect x="32" y="32" width="448" height="448" rx="105" ry="105"/>
    </clipPath>
  </defs>

  <!-- Base Squircle App Icon -->
  <g filter="url(#drop-shadow)">
    <rect x="32" y="32" width="448" height="448" rx="105" ry="105" fill="url(#bg-grad)"/>
    <rect x="32" y="32" width="448" height="448" rx="105" ry="105" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  </g>

  <!-- Icon Canvas Group (Clipped to Squircle) -->
  <g clip-path="url(#squircle-clip)">
    
    <!-- Subtle Background Grid Overlay -->
    <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
      <line x1="32" y1="128" x2="480" y2="128"/>
      <line x1="32" y1="224" x2="480" y2="224"/>
      <line x1="32" y1="320" x2="480" y2="320"/>
      <line x1="32" y1="416" x2="480" y2="416"/>
      <line x1="128" y1="32" x2="128" y2="480"/>
      <line x1="224" y1="32" x2="224" y2="480"/>
      <line x1="320" y1="32" x2="320" y2="480"/>
      <line x1="416" y1="32" x2="416" y2="480"/>
    </g>

    <!-- Stacked Database Discs (Database Engine Nodes) -->
    <g transform="translate(136, 120)">
      
      <!-- Bottom Disc (SQLite - Mint/Cyan Highlight) -->
      <g transform="translate(0, 180)">
        <path d="M 0,28 L 0,60 C 0,75.47 53.73,88 120,88 C 186.27,88 240,75.47 240,60 L 240,28" fill="url(#disc-fill)" stroke="#37505C" stroke-width="3"/>
        <ellipse cx="120" cy="28" rx="120" ry="28" fill="url(#disc-fill)" stroke="#565F89" stroke-width="3"/>
        <ellipse cx="120" cy="28" rx="118" ry="26" fill="none" stroke="#7DCFFF" stroke-width="1.5" opacity="0.4"/>
      </g>

      <!-- Middle Disc (Postgres - Slate Blue Highlight) -->
      <g transform="translate(0, 90)">
        <path d="M 0,28 L 0,60 C 0,75.47 53.73,88 120,88 C 186.27,88 240,75.47 240,60 L 240,28" fill="url(#disc-fill)" stroke="#37505C" stroke-width="3"/>
        <ellipse cx="120" cy="28" rx="120" ry="28" fill="url(#disc-fill)" stroke="#565F89" stroke-width="3"/>
        <ellipse cx="120" cy="28" rx="118" ry="26" fill="none" stroke="#7AA2F7" stroke-width="1.5" opacity="0.5"/>
      </g>

      <!-- Top Disc (MySQL - Amber Highlight) -->
      <g transform="translate(0, 0)">
        <path d="M 0,28 L 0,60 C 0,75.47 53.73,88 120,88 C 186.27,88 240,75.47 240,60 L 240,28" fill="url(#disc-fill)" stroke="#37505C" stroke-width="3"/>
        <ellipse cx="120" cy="28" rx="120" ry="28" fill="url(#disc-fill)" stroke="#565F89" stroke-width="3"/>
        <ellipse cx="120" cy="28" rx="118" ry="26" fill="none" stroke="#E0AF68" stroke-width="2" opacity="0.7"/>
      </g>

    </g>

    <!-- "Zippa" Diagonal Cut Lightning / Z Motif -->
    <!-- Back Glow Path -->
    <path d="M 330 90 
             L 210 240 
             H 290 
             L 170 420 
             L 210 270 
             H 140 
             Z" 
          fill="url(#bolt-glow)" 
          filter="url(#bolt-glow-filter)"
          opacity="0.8"/>

    <!-- Sharp Foreground Z-Bolt -->
    <path d="M 340 80 
             L 210 245 
             H 295 
             L 165 430 
             L 210 265 
             H 130 
             Z" 
          fill="url(#bolt-grad)" 
          stroke="#FFFFFF" 
          stroke-width="2" 
          stroke-linejoin="round"
          filter="url(#drop-shadow)"/>

    <!-- Dynamic Accent Flares -->
    <circle cx="340" cy="80" r="4" fill="#FFFFFF" filter="url(#bolt-glow-filter)"/>
    <circle cx="165" cy="430" r="4" fill="#7DCFFF" filter="url(#bolt-glow-filter)"/>

  </g>
</svg>
