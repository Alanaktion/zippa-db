[package]
name = "zippa-db"
version = "0.1.0"
edition = "2024"
# GPUI uses `std::hint::cold_path`, stable since 1.95.
rust-version = "1.95"
description = "A fast, lightweight, cross-platform database client for PostgreSQL, MySQL, and SQLite."
license = "MIT"
repository = "https://github.com/Alanaktion/zippa-db"
homepage = "https://github.com/Alanaktion/zippa-db"
readme = "README.md"
keywords = ["database", "postgres", "mysql", "sqlite", "gpui"]
categories = ["database", "gui"]
# What the published crate carries: the sources, the build script, the theme
# files it embeds, the icons `cargo packager` reads, and the docs crates.io
# shows. Development notes (`.agents/`, `AUDIT.md`, CI config) stay in git.
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/assets/themes/*.json",
    "/assets/icons/**/*",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1"
# Dump imports: gzip, bzip2, and zstd, detected by the file's magic bytes.
bzip2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
flate2 = "1"
futures = "0.3.34"
# One dependency pulls in GPUI (Zed's preview channel), gpui-base, the styled
# component library, and the default icon set.
gpui-kit = { version = "0.6", features = ["tree-sitter-sql"] }
keyring = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "bigdecimal",
    "json",
    "ipnetwork",
    "mac_address",
    "bit-vec",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Read by `cargo packager` (https://github.com/crabnebula-dev/cargo-packager)
# to produce real installable packages — macOS .app/.dmg, Linux AppImage/.deb,
# Windows NSIS/.msi — with an icon and a display name. See README.md's
# "Packaging" section for the per-platform commands.
[package.metadata.packager]
product-name = "Zippa DB"
identifier = "com.alanaktion.zippadb"
icons = ["assets/icons/zippa-db.iconset/*.png", "assets/icons/zippa-db.icns", "assets/icons/zippa-db.ico"]

# GPUI does a lot of layout and text shaping per frame, which is painfully slow
# in an unoptimized build. Optimizing dependencies (and lightly optimizing our
# own code) keeps `cargo run` usable while still building fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Smaller, faster shipped binaries for packaged builds.
[profile.release]
strip = true
lto = "thin"
