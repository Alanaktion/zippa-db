[package]
name = "zippa-db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
futures = "0.3.34"
# One dependency pulls in GPUI (Zed's preview channel), gpui-base, the styled
# component library, and the default icon set.
gpui-kit = { version = "0.6", features = ["tree-sitter-sql"] }
keyring = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "bigdecimal",
    "json",
    "ipnetwork",
    "mac_address",
    "bit-vec",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Read by `cargo packager` (https://github.com/crabnebula-dev/cargo-packager)
# to produce real installable packages — macOS .app/.dmg, Linux AppImage/.deb,
# Windows NSIS/.msi — with an icon and a display name. See README.md's
# "Packaging" section for the per-platform commands.
[package.metadata.packager]
product-name = "Zippa DB"
identifier = "com.alanaktion.zippadb"
icons = ["assets/icons/zippa-db.iconset/*.png", "assets/icons/zippa-db.icns", "assets/icons/zippa-db.ico"]

# GPUI does a lot of layout and text shaping per frame, which is painfully slow
# in an unoptimized build. Optimizing dependencies (and lightly optimizing our
# own code) keeps `cargo run` usable while still building fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Smaller, faster shipped binaries for packaged builds.
[profile.release]
strip = true
lto = "thin"
